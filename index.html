<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>馬卡龍座標拆分器</title>
  <!-- Google 字體：圓潤親和的 Quicksand 與 Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Quicksand"', '"Noto Sans TC"', 'sans-serif'],
          },
          colors: {
            macaron: {
              cream: '#FFFBF5',
              pink: '#FFD1DC',
              deepPink: '#FF9AA2',
              mint: '#D8F3DC',
              deepMint: '#74C69D',
              blue: '#D0F4DE',
              sky: '#CFE7FF',
              lavender: '#E8DFF5',
              yellow: '#FDFD96',
              butter: '#FFF3B0',
              text: '#4A4E69',
              muted: '#8A8D9F'
            }
          },
          boxShadow: {
            'soft': '0 12px 30px -8px rgba(180, 160, 180, 0.22)',
            'btn-pink': '0 8px 18px -4px rgba(255, 154, 162, 0.45)',
            'btn-mint': '0 8px 18px -4px rgba(116, 198, 157, 0.45)',
            'btn-sky': '0 8px 18px -4px rgba(130, 190, 255, 0.45)',
          }
        }
      }
    }
  </script>

  <style>
    /* 馬卡龍溫和綿密漸層背景 */
    body {
      background: linear-gradient(135deg, #FFE4E6 0%, #FFF3D6 40%, #E0F2FE 80%, #EDE9FE 100%);
      min-height: 100vh;
    }

    .macaron-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 255, 255, 0.95);
    }
  </style>
</head>
<body class="text-macaron-text font-sans flex items-center justify-center p-4 min-h-screen">

  <!-- 浮動提示 Toast -->
  <div id="toast" class="fixed top-6 px-5 py-3 rounded-2xl bg-white/95 text-macaron-text font-medium text-sm shadow-soft border border-white/80 transition-all duration-300 transform -translate-y-10 opacity-0 pointer-events-none z-50 flex items-center gap-2">
    <span id="toastIcon">✨</span>
    <span id="toastMsg">提示訊息</span>
  </div>

  <!-- 主卡片 -->
  <main class="w-full max-w-md macaron-card rounded-[2.5rem] p-6 sm:p-8 shadow-soft">
    
    <!-- 標題區域 -->
    <header class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-macaron-pink/60 text-macaron-deepPink mb-2 text-2xl shadow-inner">
        🍬
      </div>
      <h1 class="text-2xl font-bold text-macaron-text tracking-wide">可樂座標拆分</h1>
      <p class="text-xs text-macaron-muted mt-1">簡約粉嫩 • 貼上即切分經緯度</p>
    </header>

    <!-- 輸入框區域 -->
    <section class="space-y-3 mb-6">
      <div class="relative">
        <input 
          id="coordInput" 
          type="text" 
          placeholder="例如：25.221887,121.641038"
          class="w-full bg-white/90 text-macaron-text placeholder-macaron-muted/60 text-center font-medium rounded-2xl px-4 py-3.5 border-2 border-macaron-lavender focus:border-macaron-deepPink focus:outline-none transition-all shadow-sm"
        />
      </div>

      <!-- 按鈕區：讀取剪貼簿 + 產生 -->
      <div class="grid grid-cols-2 gap-3">
        <!-- 讀取剪貼簿 -->
        <button 
          id="btnPaste" 
          type="button" 
          class="flex items-center justify-center gap-1.5 py-3 px-4 rounded-2xl bg-macaron-sky hover:bg-[#bde0fe] text-[#2c5364] font-semibold text-sm transition-all active:scale-95 shadow-btn-sky">
          <i data-lucide="clipboard" class="w-4 h-4"></i>
          <span>讀取剪貼簿</span>
        </button>

        <!-- 產生按鈕 -->
        <button 
          id="btnSplit" 
          type="button" 
          class="flex items-center justify-center gap-1.5 py-3 px-4 rounded-2xl bg-macaron-deepPink hover:bg-[#ff8690] text-white font-semibold text-sm transition-all active:scale-95 shadow-btn-pink">
          <i data-lucide="sparkles" class="w-4 h-4"></i>
          <span>產生拆分</span>
        </button>
      </div>
    </section>

    <!-- 分隔裝飾線 -->
    <div class="flex items-center gap-3 my-5">
      <div class="h-0.5 flex-1 bg-macaron-lavender/60 rounded-full"></div>
      <span class="text-xs font-bold text-macaron-muted/70 tracking-wider">拆分結果</span>
      <div class="h-0.5 flex-1 bg-macaron-lavender/60 rounded-full"></div>
    </div>

    <!-- 輸出與獨立複製按鈕 -->
    <section class="space-y-4">
      
      <!-- 緯度卡片 (純數字無逗號) -->
      <div class="bg-white/80 border border-macaron-pink/60 rounded-2xl p-4 flex items-center justify-between shadow-sm">
        <div class="flex flex-col text-left overflow-hidden pr-2">
          <span class="text-[11px] font-semibold text-macaron-deepPink tracking-wide uppercase">座標前半段 (緯度)</span>
          <span id="latText" class="font-bold text-base sm:text-lg text-macaron-text truncate select-all mt-0.5">尚未產生</span>
        </div>
        <button 
          id="copyLatBtn" 
          type="button"
          class="shrink-0 flex items-center gap-1 bg-macaron-pink hover:bg-[#ffb6c1] text-[#933b43] font-bold text-xs py-2.5 px-3.5 rounded-xl transition-all active:scale-95">
          <i data-lucide="copy" class="w-3.5 h-3.5"></i>
          <span class="btn-label">複製</span>
        </button>
      </div>

      <!-- 經度卡片 (純數字) -->
      <div class="bg-white/80 border border-macaron-deepMint/40 rounded-2xl p-4 flex items-center justify-between shadow-sm">
        <div class="flex flex-col text-left overflow-hidden pr-2">
          <span class="text-[11px] font-semibold text-macaron-deepMint tracking-wide uppercase">座標後半段 (經度)</span>
          <span id="lngText" class="font-bold text-base sm:text-lg text-macaron-text truncate select-all mt-0.5">尚未產生</span>
        </div>
        <button 
          id="copyLngBtn" 
          type="button"
          class="shrink-0 flex items-center gap-1 bg-macaron-mint hover:bg-[#b7e4c7] text-[#2d6a4f] font-bold text-xs py-2.5 px-3.5 rounded-xl transition-all active:scale-95">
          <i data-lucide="copy" class="w-3.5 h-3.5"></i>
          <span class="btn-label">複製</span>
        </button>
      </div>

    </section>

  </main>

  <script>
    // 元素參照
    const coordInput = document.getElementById('coordInput');
    const btnPaste = document.getElementById('btnPaste');
    const btnSplit = document.getElementById('btnSplit');
    const latText = document.getElementById('latText');
    const lngText = document.getElementById('lngText');
    const copyLatBtn = document.getElementById('copyLatBtn');
    const copyLngBtn = document.getElementById('copyLngBtn');

    let currentLat = '';
    let currentLng = '';

    // 初始化 Lucide 圖標
    lucide.createIcons();

    // 核心拆分函式：拆為純淨無逗號的「緯度」與「經度」
    function processCoordinates(rawText) {
      if (!rawText || !rawText.trim()) {
        showToast('請先輸入或貼上座標唷！', '🌸');
        return false;
      }

      const trimmed = rawText.trim();
      // 比對經緯格式 (支援逗號、空格、分號等間隔)
      const matches = trimmed.match(/([-+]?\d{1,3}(?:\.\d+)?)[,\s;/|\t]+([-+]?\d{1,3}(?:\.\d+)?)/);

      if (matches && matches.length >= 3) {
        currentLat = matches[1].trim(); // 純座標數字，不加逗號
        currentLng = matches[2].trim();

        latText.textContent = currentLat;
        lngText.textContent = currentLng;
        return true;
      } else {
        showToast('座標格式不太正確，請檢查看看～', '⚠️');
        return false;
      }
    }

    // 點擊「產生」按鈕
    btnSplit.addEventListener('click', () => {
      const ok = processCoordinates(coordInput.value);
      if (ok) {
        showToast('拆分完成囉！✨', '🎉');
      }
    });

    // Enter 快捷鍵直接產生
    coordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const ok = processCoordinates(coordInput.value);
        if (ok) showToast('拆分完成囉！✨', '🎉');
      }
    });

    // 「讀取剪貼簿」功能
    btnPaste.addEventListener('click', async () => {
      try {
        if (navigator.clipboard && navigator.clipboard.readText) {
          const text = await navigator.clipboard.readText();
          if (text) {
            coordInput.value = text;
            const ok = processCoordinates(text);
            if (ok) {
              showToast('已讀取剪貼簿並拆分完成！', '📋');
            }
          } else {
            showToast('剪貼簿好像是空的呢～', '💡');
          }
        } else {
          showToast('請直接在框內按 Ctrl+V 貼上喔！', '💡');
        }
      } catch (err) {
        showToast('無法直接存取，請手動貼上 (Ctrl+V)', '💡');
      }
    });

    // 複製文字通用函式 (安全相容 iFrame 環境)
    function copyText(content, btnEl, successLabel) {
      if (!content) {
        showToast('還沒有可複製的座標唷！', '⚠️');
        return;
      }

      let copied = false;
      try {
        const textarea = document.createElement('textarea');
        textarea.value = content;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        copied = document.execCommand('copy');
        document.body.removeChild(textarea);
      } catch (e) {
        copied = false;
      }

      if (!copied && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(content).then(() => {
          animateButtonSuccess(btnEl, successLabel);
        });
        return;
      }

      if (copied) {
        animateButtonSuccess(btnEl, successLabel);
      } else {
        showToast('複製失敗，請手動選取', '⚠️');
      }
    }

    // 複製成功時的按鈕俏皮反饋
    function animateButtonSuccess(btnEl, text) {
      const label = btnEl.querySelector('.btn-label');
      const originalText = label ? label.textContent : '複製';
      if (label) label.textContent = '已複製! ✨';
      showToast(`${text} 已複製到剪貼簿`, '✨');

      setTimeout(() => {
        if (label) label.textContent = originalText;
      }, 1400);
    }

    // 複製緯度按鈕 (純數字)
    copyLatBtn.addEventListener('click', () => {
      copyText(currentLat, copyLatBtn, currentLat);
    });

    // 複製經度按鈕
    copyLngBtn.addEventListener('click', () => {
      copyText(currentLng, copyLngBtn, currentLng);
    });

    // 溫和的小 Toast 提示
    let toastTimeout;
    function showToast(msg, icon = '✨') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');

      toastMsg.textContent = msg;
      toastIcon.textContent = icon;

      toast.classList.remove('-translate-y-10', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('-translate-y-10', 'opacity-0');
      }, 2000);
    }
  </script>
</body>
</html>
```
